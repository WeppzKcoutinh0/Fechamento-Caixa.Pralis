name: Sincronizar vendas (planilha CREARE)

# Chama o cron do app (server/routes/cron/importar-planilha.get.ts). O bot da loja passou a
# escrever na planilha a cada ~1 minuto (17/09/2026) e o cron nativo da Vercel só roda 1x/dia
# (plano Hobby, ver vercel.json) — não acompanha isso de perto. Ver TASKS.md (13ª-16ª revisão).
#
# NÃO confia no `schedule` do GitHub pra frequência (18/09/2026): medido na prática, um cron
# configurado pra "a cada 5 minutos" rodou em média 1x cada ~2-4h num repositório com pouca
# atividade — o GitHub Actions atrasa/pula agendamentos frequentes sem aviso, é documentado que
# isso pode acontecer, mas na prática foi bem mais severo que "só um atraso ocasional". Por isso
# o `schedule` aqui dispara só de 6 em 6 horas (agendamentos menos frequentes parecem sofrer menos
# esse atraso) e, uma vez que UMA execução começa, ela mesma fica em loop chamando o endpoint a
# cada 5 minutos por dentro, por quase as 6 horas seguintes — assim a frequência real não depende
# do agendador do GitHub voltar a disparar, só de UMA execução ter começado.
#
# Precisa do secret CRON_SECRET (Settings -> Secrets and variables -> Actions -> New repository
# secret) com o MESMO valor da env var CRON_SECRET configurada no projeto da Vercel.
#
# GitHub desativa workflows agendados sozinho depois de 60 dias sem nenhum commit no repositório
# — se o sync parar de rodar depois de um tempo sem mudanças no código, é só isso, reative em
# Actions -> este workflow -> "Enable workflow".
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    # Um pouco abaixo do próximo disparo agendado (6h = 360min) pra terminar de forma limpa antes
    # do limite de 6h por job do GitHub (Hobby/free) e não sobrepor com a próxima execução.
    timeout-minutes: 350
    steps:
      - name: Sincronizar em loop por ~5h50 (chama de 5 em 5 minutos)
        run: |
          fim=$((SECONDS + 350*60))
          tentativa=0
          ok=0
          erros=0
          while [ "$SECONDS" -lt "$fim" ]; do
            tentativa=$((tentativa + 1))
            if curl --fail --show-error --silent --max-time 90 \
                 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                 "https://fechamento-caixa-pralis.vercel.app/cron/importar-planilha"; then
              ok=$((ok + 1))
            else
              erros=$((erros + 1))
              echo "::warning::tentativa $tentativa falhou (isolada, o loop continua)"
            fi
            echo
            sleep 300
          done
          echo "Resumo: $tentativa tentativas, $ok ok, $erros com erro."
          # Só falha o job (e manda e-mail) se TODAS as tentativas falharam — uma falha isolada de
          # rede não deve gerar alarme, mas todas falhando (ex.: secret errado de novo) sim.
          if [ "$ok" -eq 0 ] && [ "$tentativa" -gt 0 ]; then
            echo "Todas as tentativas falharam." >&2
            exit 1
          fi
