name: Sincronizar vendas (planilha CREARE)

# Chama o cron do app (server/routes/cron/importar-planilha.get.ts) a cada 5 minutos — o menor
# intervalo que o GitHub Actions aceita em `schedule` (sintaxe cron não permite mais fino que
# 1min, mas na prática o mínimo confiável é 5min). Existe porque o plano Hobby da Vercel só deixa
# rodar 1x/dia (ver vercel.json), e o bot da loja passou a escrever na planilha a cada ~1 minuto
# (17/09/2026) — 1x/dia não acompanha mais isso de perto. Ver TASKS.md (13ª/14ª revisão).
#
# Precisa do secret CRON_SECRET (Settings -> Secrets and variables -> Actions -> New repository
# secret) com o MESMO valor da env var CRON_SECRET configurada no projeto da Vercel.
#
# GitHub desativa workflows agendados sozinho depois de 60 dias sem nenhum commit no repositório
# — se o sync parar de rodar depois de um tempo sem mudanças no código, é só isso, reative em
# Actions -> este workflow -> "Enable workflow".
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /cron/importar-planilha
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://fechamento-caixa-pralis.vercel.app/cron/importar-planilha"
